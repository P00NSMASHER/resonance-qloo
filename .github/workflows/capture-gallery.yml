name: Capture judge gallery

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture-judge-gallery.mjs'
      - '.github/workflows/capture-gallery.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot runtime
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Capture published product
        env:
          CHROME_PATH: /usr/bin/google-chrome
          RESONANCE_BASE_URL: https://resonance-qloo.floot.app
        run: node scripts/capture-judge-gallery.mjs
      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonance-judge-gallery
          path: judge-gallery/*.png
          if-no-files-found: error
          retention-days: 7
