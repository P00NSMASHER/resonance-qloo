name: Capture judge gallery

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture-judge-gallery.mjs'
      - '.github/workflows/capture-gallery.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot runtime
        run: npm install --no-save --ignore-scripts playwright-core@1.55.0
      - name: Capture published product
        env:
          CHROME_PATH: /usr/bin/google-chrome
          RESONANCE_BASE_URL: https://resonance-qloo.floot.app
        run: node scripts/capture-judge-gallery.mjs
      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: resonance-judge-gallery
          path: judge-gallery/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Archive published screenshots on submission branch
        if: github.ref == 'refs/heads/submission/2026-judge-pack'
        run: |
          mkdir -p docs/judge-gallery
          cp -f judge-gallery/*.png docs/judge-gallery/
          python3 - <<'PY'
          import hashlib,json,pathlib,datetime,os
          root=pathlib.Path('docs/judge-gallery')
          captures=[]
          for file in sorted(root.glob('*.png')):
              contents=file.read_bytes()
              captures.append({'name':file.name,'sha256':hashlib.sha256(contents).hexdigest(),'bytes':len(contents)})
          report={
              'captureType':'actual-published-browser-screenshots',
              'captureDateUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'source':'https://resonance-qloo.floot.app',
              'sourceCommit':os.environ.get('GITHUB_SHA'),
              'note':'Browser-rendered screenshots; not mockups, not human-study outcomes. Captures may show genuinely returned Qloo labels that can vary over time.',
              'files':captures
          }
          (root/'manifest.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/judge-gallery/
          if ! git diff --cached --quiet; then
            git commit -m "docs(judging): archive durable published product screenshots"
            git push origin HEAD:submission/2026-judge-pack
          fi
