name: Temporary brand artwork source archival

on:
  push:
    paths:
      - '.github/workflows/capture-gallery.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Archive original public Resonance artwork
        run: |
          mkdir -p public/brand
          curl --fail --location --silent --show-error --retry 3 --max-time 40 "https://resonance-qloo.floot.app/_cdn/static/559ce4f0-ef12-4f04-ace1-f855c328ffa1.png" -o public/brand/resonance-cultural-atlas.png
          curl --fail --location --silent --show-error --retry 3 --max-time 40 "https://resonance-qloo.floot.app/_cdn/static/10b9d53a-6d7b-43b2-85c4-27117e62d390.png" -o public/brand/resonance-connection-emblem.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ['resonance-cultural-atlas.png','resonance-connection-emblem.png']:
              p=Path('public/brand')/name
              b=p.read_bytes()
              if b[:8]!=b'\x89PNG\r\n\x1a\n' or len(b)<10000:
                  raise SystemExit('Invalid image download: '+name)
              w,h=struct.unpack('>II',b[16:24])
              if w<500 or h<500: raise SystemExit('Image resolution inadequate: '+name)
              print('Verified original public brand PNG:',name,w,h,len(b))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/brand/resonance-cultural-atlas.png public/brand/resonance-connection-emblem.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(brand): preserve original artwork inside public repository"
            git push origin HEAD:submission/2026-judge-pack
          fi
