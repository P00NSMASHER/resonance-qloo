name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preview-mode smoke test
        run: npm run smoke:preview
      - name: UI stale-state safety self-test
        run: npm run ui:state:selftest
      - name: Deployment checker syntax
        run: node --check scripts/check-deployment.mjs
      - name: Deployment checker self-test
        run: npm run deployment:check:selftest
      - name: Qloo proof script syntax
        run: node --check scripts/qloo-mcp-proof.mjs
      - name: Qloo proof redaction self-test
        run: npm run qloo:proof:redaction:selftest
      - name: Qloo proof environment isolation self-test
        run: npm run qloo:proof:env:selftest
      - name: Live evidence capture syntax
        run: node --check scripts/capture-live-evidence.mjs
      - name: Live evidence capture self-test
        run: npm run evidence:capture:selftest
      - name: Submission artifact preflight
        run: npm run submission:preflight:offline
      - name: Public deployment parity (advisory)
        id: deployment_parity
        continue-on-error: true
        run: npm run deployment:check
      - name: Live Qloo readiness (advisory)
        id: qloo_live_readiness
        continue-on-error: true
        run: npm run qloo:live:check
      - name: Summarize public deployment parity
        if: always()
        run: |
          if [ "${{ steps.deployment_parity.outcome }}" = "success" ]; then
            echo "### Public deployment parity: ✅ current" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Public deployment parity failed::The Floot deployment is stale or incomplete. Re-publish the reviewed GitHub head, then run npm run deployment:check."
            echo "### Public deployment parity: ⚠️ stale or incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-publish the reviewed GitHub head to Floot, then run `npm run deployment:check`." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.qloo_live_readiness.outcome }}" = "success" ]; then
            echo "### Live Qloo readiness: ✅ ready" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Live Qloo not ready::The deployment is current, but the public app has not verified a live Qloo credential yet."
            echo "### Live Qloo readiness: ⚠️ credential not ready" >> "$GITHUB_STEP_SUMMARY"
            echo "After connecting the event-issued credential, run `npm run qloo:live:check`." >> "$GITHUB_STEP_SUMMARY"
          fi
