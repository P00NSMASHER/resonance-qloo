name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Qloo secret scanner self-test
        run: npm run security:secrets:selftest
      - name: Qloo secret leak scan
        run: npm run security:secrets:check
      - name: Production dependency audit
        run: npm run security:dependencies:check
      - name: Exact Floot production source parity
        run: npm run floot:production:parity
      - name: Public build receipt
        run: npm run build:receipt:check
      - name: Typecheck
        run: npm run typecheck
      - name: Reviewed study evidence fail-closed self-test
        run: npm run study:evidence:selftest
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Preview-mode smoke test
        run: npm run smoke:preview
      - name: UI stale-state safety self-test
        run: npm run ui:state:selftest
      - name: Deployment checker syntax
        run: node --check scripts/check-deployment.mjs
      - name: Deployment checker self-test
        run: npm run deployment:check:selftest
      - name: Qloo proof script syntax
        run: node --check scripts/qloo-mcp-proof.mjs
      - name: Qloo proof redaction self-test
        run: npm run qloo:proof:redaction:selftest
      - name: Qloo proof environment isolation self-test
        run: npm run qloo:proof:env:selftest
      - name: Live evidence capture syntax
        run: node --check scripts/capture-live-evidence.mjs
      - name: Live evidence capture self-test
        run: npm run evidence:capture:selftest
      - name: Submission artifact preflight
        run: npm run submission:preflight:offline
      - name: Durable judge captures and original brand assets
        run: npm run submission:assets:check
      - name: Devpost public-story drift detector self-test (offline)
        run: npm run submission:devpost:selftest
      - name: Public deployment parity
        id: deployment_parity
        run: npm run deployment:check
      - name: Live Qloo readiness self-test
        run: npm run qloo:live:selftest
      - name: Live Qloo readiness
        id: qloo_live_readiness
        run: npm run qloo:live:check
      - name: Summarize public deployment parity
        if: always()
        run: |
          if [ "${{ steps.deployment_parity.outcome }}" = "success" ]; then
            echo "### Public deployment parity: ✅ current" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.deployment_parity.outcome }}" = "failure" ]; then
            echo "::warning title=Public deployment parity failed::The Floot deployment is stale or incomplete. Re-publish the reviewed GitHub head, then run npm run deployment:check."
            echo "### Public deployment parity: ⚠️ stale or incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-publish the reviewed GitHub head to Floot, then run `npm run deployment:check`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Public deployment parity: ⏭️ not evaluated" >> "$GITHUB_STEP_SUMMARY"
            echo "An earlier required CI step stopped the advisory deployment check." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.qloo_live_readiness.outcome }}" = "success" ]; then
            echo "### Live Qloo readiness: ✅ ready" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.qloo_live_readiness.outcome }}" = "failure" ]; then
            echo "::warning title=Live Qloo not ready::See the readiness-step output for credential-missing, verification-failed, or rate-limited classification."
            echo "### Live Qloo readiness: ⚠️ not ready" >> "$GITHUB_STEP_SUMMARY"
            echo "After fixing the classified state, run `npm run qloo:cutover:verify`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live Qloo readiness: ⏭️ not evaluated" >> "$GITHUB_STEP_SUMMARY"
            echo "An earlier required CI step stopped the advisory readiness check." >> "$GITHUB_STEP_SUMMARY"
          fi
