openapi: 3.1.0
info:
  title: Resonance API
  version: 0.15.0
  description: >
    Server-side API for Resonance, a Qloo-powered cultural engagement agent.
    The Qloo credential remains on the server and is never returned to clients.
servers:
  - url: http://localhost:8787
    description: Local production-style server
paths:
  /api/status:
    get:
      summary: Read Qloo connection state
      operationId: getStatus
      parameters:
        - in: query
          name: refresh
          required: false
          schema:
            type: string
            enum: ['1']
          description: Request a bounded re-verification by invalidating any cached Qloo probe state, including ready, then probing Qloo again. Forced retries are rate-limited server-side.
      responses:
        '200':
          description: Current service mode
          content:
            application/json:
              schema:
                type: object
                required: [qlooConfigured, qlooConnected, qlooStatus, qlooApiOrigin, mode, service, contractVersion]
                properties:
                  qlooConfigured: { type: boolean }
                  qlooConnected: { type: boolean }
                  qlooStatus: { type: string, enum: [preview, ready, degraded, rate-limited] }
                  qlooApiOrigin:
                    type: string
                    format: uri
                    description: Non-secret HTTPS origin used for Qloo requests.
                  mode: { type: string, enum: [live, preview] }
                  service: { type: string, const: resonance }
                  contractVersion:
                    type: string
                    description: Shared frontend/backend deployment contract version used for production parity checks.
  /api/recommend:
    post:
      summary: Build a culturally grounded engagement session
      operationId: createRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecommendationRequest' }
      responses:
        '200':
          description: Qloo-grounded, agent-orchestrated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommendationResponse' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: One or more non-exact Qloo entity matches must be explicitly confirmed before taste analysis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolutionReviewRequired' }
        '413':
          description: Request body exceeds the bounded input size
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Qloo returned insufficient evidence for a useful session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Public-demo or upstream Qloo rate limit reached
          headers:
            Retry-After:
              description: Seconds to wait when the local public-demo limiter provides a retry window.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Qloo request failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Event-issued Qloo credential is not connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: Qloo timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  schemas:
    RecommendationRequest:
      type: object
      required: [anchors, energy, setting]
      additionalProperties: false
      properties:
        anchors:
          type: array
          minItems: 2
          maxItems: 4
          items:
            oneOf:
              - { type: string, minLength: 2, maxLength: 100 }
              - $ref: '#/components/schemas/AnchorInput'
        energy: { type: string, enum: [calm, social, active] }
        setting: { type: string, enum: [one-on-one, small-group, community] }
        durationMinutes:
          type: integer
          enum: [30, 45, 60]
          default: 45
          description: Requested total session length in minutes.
        confirmedEntityIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
          description: Qloo entity IDs explicitly confirmed by the user after a resolution-review response. IDs alone do not authorize a non-exact match; the matching reviewToken must also be supplied.
        reviewToken:
          type: string
          minLength: 1
          maxLength: 128
          description: Ephemeral server-issued review receipt returned by the 409 response. It is HMAC-bound to the normalized request context and reviewed entity IDs and expires after five minutes.
    AnchorInput:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query: { type: string, minLength: 2, maxLength: 100 }
        type:
          type: string
          enum: [any, artist, movie, book, brand, destination, place, podcast, tv_show, videogame]
          description: Optional category hint mapped to Qloo's documented entity-type URNs.
    ResolvedAnchor:
      type: object
      required: [query, name, entityId, resolutionMatch]
      properties:
        query: { type: string }
        name: { type: string }
        entityId:
          type: string
          description: Qloo entity UUID or entity URN returned by resolution.
        requestedTypeUrn:
          type: string
          description: Optional Qloo entity-type constraint the user selected for this anchor.
        resolutionMatch:
          type: string
          enum: [exact-name, top-result]
          description: Whether the resolved Qloo entity name exactly matches the normalized input or is the first valid Qloo result and should be reviewed.
    Affinity:
      type: object
      required: [label, score, rank]
      properties:
        label: { type: string }
        score:
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: 'null' }
          description: Numeric affinity only when Qloo returned one; null otherwise.
        rank:
          type: integer
          minimum: 1
          description: Position in Qloo's affinity-ranked tag results.
    PlanItem:
      type: object
      required: [title, duration, action, why, affinityLabel]
      properties:
        title: { type: string }
        duration: { type: string }
        action: { type: string }
        why: { type: string }
        anchorName:
          type: string
          description: Supplied favorite explicitly grounding this plan step when available.
        affinityLabel:
          type: string
          description: Qloo-ranked affinity signal used as the adjacent cultural bridge for this step.
    AgentTraceStep:
      type: object
      required: [stage, status, detail]
      properties:
        stage: { type: string, enum: [resolve, evaluate, compose, explain] }
        status: { type: string, enum: [ok, warning] }
        detail: { type: string }
    Evidence:
      type: object
      required: [meanNormalizedScore, evidenceBasis, selectedAffinityCount, returnedAffinityCount, selectedAffinityLabels, resolvedAnchorCount, exactResolutionCount, topResultResolutionCount, categoryHintCount, explainabilityResultCount, aggregateExplainabilityAvailable, sessionDurationMinutes, energy, setting]
      properties:
        meanNormalizedScore:
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: 'null' }
          description: Mean normalized score only when enough numeric Qloo scores are present; never manufactured from rank.
        evidenceBasis:
          type: string
          enum: [normalized-score, ranked-order]
        selectedAffinityCount: { type: integer, minimum: 3, maximum: 4 }
        returnedAffinityCount:
          type: integer
          minimum: 3
          maximum: 8
          description: Number of distinct Qloo affinity signals retained from the taste-analysis response before plan selection.
        selectedAffinityLabels:
          type: array
          minItems: 3
          maxItems: 4
          items: { type: string, minLength: 1 }
          description: Exact Qloo affinity labels selected by the agent for composing the plan.
        resolvedAnchorCount: { type: integer, minimum: 2, maximum: 4 }
        exactResolutionCount:
          type: integer
          minimum: 0
          maximum: 4
          description: Number of resolved entities whose normalized Qloo name exactly matches the input anchor.
        topResultResolutionCount:
          type: integer
          minimum: 0
          maximum: 4
          description: Number of resolved entities taken from Qloo's first valid result without an exact normalized name match; these should be reviewed.
        categoryHintCount:
          type: integer
          minimum: 0
          maximum: 4
          description: Number of resolved anchors that used an explicit Qloo entity-type hint.
        explainabilityResultCount:
          type: integer
          minimum: 0
          description: Number of Qloo taste results containing non-empty query.explainability metadata.
        aggregateExplainabilityAvailable:
          type: boolean
          description: Whether Qloo returned non-empty top-level query.explainability metadata.
        sessionDurationMinutes:
          type: integer
          enum: [30, 45, 60]
          description: Session length used to allocate the four activity timeboxes.
        energy:
          type: string
          enum: [calm, social, active]
          description: Energy setting used by the agent when composing the session.
        setting:
          type: string
          enum: [one-on-one, small-group, community]
          description: Facilitation setting used by the agent when composing the session.
    RequestContext:
      type: object
      additionalProperties: false
      required: [anchors, energy, setting, durationMinutes]
      properties:
        anchors:
          type: array
          minItems: 2
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [query]
            properties:
              query: { type: string, minLength: 2, maxLength: 100 }
              typeUrn:
                type: string
                description: Normalized Qloo entity-type URN used for this submitted anchor when a category hint was supplied.
        energy: { type: string, enum: [calm, social, active] }
        setting: { type: string, enum: [one-on-one, small-group, community] }
        durationMinutes: { type: integer, enum: [30, 45, 60] }
      description: Normalized submitted session context executed by the server and echoed back as a provenance receipt.
    Provenance:
      type: object
      required: [source, apiOrigin, contractVersion, generatedAt]
      properties:
        source:
          type: string
          const: qloo-live
        apiOrigin:
          type: string
          format: uri
          description: Non-secret Qloo API origin used for this live recommendation.
        contractVersion:
          type: string
          minLength: 1
          description: Shared frontend/backend deployment contract version that produced this live recommendation.
        generatedAt:
          type: string
          format: date-time
    RecommendationResponse:
      type: object
      required: [requestContext, summary, resolvedAnchors, affinities, plan, agentTrace, evidence, provenance]
      properties:
        requestContext: { $ref: '#/components/schemas/RequestContext' }
        summary: { type: string }
        resolvedAnchors:
          type: array
          items: { $ref: '#/components/schemas/ResolvedAnchor' }
        affinities:
          type: array
          items: { $ref: '#/components/schemas/Affinity' }
        plan:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/PlanItem' }
        agentTrace:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/AgentTraceStep' }
        evidence: { $ref: '#/components/schemas/Evidence' }
        provenance: { $ref: '#/components/schemas/Provenance' }
    ResolutionReviewRequired:
      type: object
      required: [error, code, contractVersion, requestContext, resolvedAnchors, reviewToken]
      properties:
        error:
          type: string
          const: Review Qloo entity matches before continuing.
        code:
          type: string
          const: QLOO_RESOLUTION_REVIEW_REQUIRED
        contractVersion:
          type: string
          minLength: 1
          description: Backend deployment contract version that minted this review receipt.
        requestContext: { $ref: '#/components/schemas/RequestContext' }
        reviewToken:
          type: string
          minLength: 1
          maxLength: 128
          description: Ephemeral receipt that must accompany the confirmed top-result entity IDs on the follow-up request.
        resolvedAnchors:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: '#/components/schemas/ResolvedAnchor' }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
